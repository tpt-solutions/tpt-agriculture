[package]
name = "tpt-agriculture"
version = "0.1.0"
description = "TPT Agriculture — Farm Management"
authors = ["TPT Solutions"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "tpt_agriculture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
